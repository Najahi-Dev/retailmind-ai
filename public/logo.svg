<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RetailMind AI">
  <defs>
    <linearGradient id="rm-bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="rm-glow" cx="150" cy="96" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rm-line" x1="170" y1="360" x2="352" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#rm-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#rm-glow)"/>

  <!-- Bag handle -->
  <path d="M196 196 V170 a60 60 0 0 1 120 0 V196" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>

  <!-- Bag body -->
  <path d="M150 188 H362 a22 22 0 0 1 21.9 20 L401 388 a34 34 0 0 1 -33.9 37 H144.9 a34 34 0 0 1 -33.9 -37 L128.1 208 A22 22 0 0 1 150 188 Z" fill="#FFFFFF"/>

  <!-- Forecast line (AI nodes) -->
  <polyline points="172,360 228,306 278,334 344,258" fill="none" stroke="url(#rm-line)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="172" cy="360" r="17" fill="#4F46E5"/>
  <circle cx="228" cy="306" r="17" fill="#5B3EE8"/>
  <circle cx="278" cy="334" r="17" fill="#6A3AEA"/>
  <circle cx="344" cy="258" r="24" fill="#7C3AED"/>
  <circle cx="344" cy="258" r="9" fill="#FFFFFF"/>
